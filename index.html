<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F1ECE2" />
  <title>DUQAIO Noodle Universe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E5231B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%81%86%E3%81%8D%E3%81%93%E3%81%A9%E3%81%AE%E3%82%93%E3%83%9E%E3%83%A1%E3%83%A9%E3%83%B3%E3%83%BC%E5%86%85%E5%AE%87%E5%AE%99%E5%BA%97%E6%8B%85%E6%B2%B9%E6%B5%B7%E8%80%81%E8%BE%9B%E9%81%94%E9%85%8D%E9%BA%BA%E9%BB%92&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- chilli sticker, used for heat signs -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="1" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="4.5"/>
      </filter>
      <symbol id="chili" viewBox="0 0 48 48">
        <g stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
          <path d="M14 15 C 9 24, 13 37, 33 43 C 37 44, 39 40, 35 38 C 24 32, 21 24, 22 16 C 21 12, 16 11, 14 15 Z" fill="#E5231B"/>
          <path d="M13 16 C 12 11, 16 8, 21 9 C 23 10, 23 13, 22 16 C 19 14, 16 14, 13 16 Z" fill="#2E8B3A"/>
          <path d="M18 9 C 18 6, 20 4, 24 3" fill="none" stroke="#2E8B3A" stroke-width="3" stroke-linecap="round" paint-order="normal"/>
        </g>
        <path d="M16 21 C 15 27, 18 33, 26 37" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>
  <main id="app">
    <!-- Dish universe -->
    <section id="universe" aria-label="Menu: drag to explore, tap a bowl">
      <div id="orbit">
        <div class="mega" aria-hidden="true"><span class="mega-word" data-brand></span></div>
        <div id="menuDoodles" class="doodle-layer" aria-hidden="true"></div>
        <div id="focus" class="focus" aria-hidden="true"></div>
        <div id="items"></div>
      </div>
    </section>

    <!-- Minimal chrome -->
    <header class="chrome top">
      <div class="mark"><span data-brand></span><sup>®</sup></div>
      <div class="meta"><span class="jp" data-brand-jp></span><span class="count" id="bowlCount"></span></div>
    </header>
    <div class="layout-switch" id="layoutSwitch" role="group" aria-label="Showcase layout">
      <button data-layout="halo" aria-pressed="false"><b>A</b> HALO</button>
      <button data-layout="wheel" aria-pressed="false"><b>B</b> WHEEL</button>
    </div>
    <div class="chrome bottom-hint" aria-hidden="true"><span class="dot"></span>DRAG TO SPIN · TAP A BOWL</div>

    <!-- Dish detail -->
    <section id="detail" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dName">
      <div id="dDoodles" class="doodle-layer" aria-hidden="true"></div>
      <button class="close" id="dClose" aria-label="Back to menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
      </button>
      <div class="d-stage">
        <div class="d-index" id="dIndex"></div>
        <div class="d-jp" id="dJp" aria-hidden="true"></div>
        <canvas id="hero" aria-label=""></canvas>
        <div id="heroHeat" class="heat-cluster hero-heat" aria-hidden="true"></div>
        <button class="mode-chip" id="modeChip" aria-label="Switch between real and anime artwork"><span class="m-real">REAL</span><span class="m-sep">⇄</span><span class="m-anime">ANIME</span></button>
      </div>
      <div class="d-info">
        <div id="dHeat" class="d-heat"></div>
        <h1 id="dName" class="d-name"></h1>
        <p id="dDesc" class="d-desc"></p>
        <div class="d-row">
          <div class="d-price" id="dPrice"></div>
          <div class="stepper" role="group" aria-label="Quantity">
            <button id="qMinus" aria-label="Decrease quantity">−</button>
            <output id="qVal" aria-live="polite">1</output>
            <button id="qPlus" aria-label="Increase quantity">+</button>
          </div>
        </div>
        <button class="add" id="addBtn"><span class="add-label">ADD TO ORDER</span><span class="add-total" id="addTotal"></span></button>
      </div>
    </section>

    <!-- My Orders button -->
    <button id="fab" class="fab" aria-label="My orders" hidden>
      <svg class="fab-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M18 3 L27 12 M22 2 L29 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M4 14 H28 C28 21 23 26 16 26 C9 26 4 21 4 14 Z" fill="currentColor"/>
        <path d="M11 28 H21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="fab-count" id="fabCount">0</span>
    </button>

    <!-- Order sheet (cart → method → details → review → done) -->
    <section id="sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Your order">
      <div class="sheet-inner" id="sheetInner"></div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="fx" class="doodle-layer fx" aria-hidden="true"></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
